{% set title = "Track your support ticket" %}
{% include "_head.html" %}
<body class="track-page">
<div class="track-card">
  <div class="track-header">
    <span class="track-icon" aria-hidden="true">🎫</span>
    <h1>Track your support ticket</h1>
    <p>Enter your ticket ID and the email address you used when you opened it.</p>
  </div>

  <form id="trackForm" class="track-form" novalidate>
    <div class="form-group">
      <label for="ticketIdInput">Ticket ID</label>
      <input type="text" id="ticketIdInput" class="form-control" placeholder="TKT-XXXXXX" autocomplete="off" spellcheck="false" maxlength="20" required>
    </div>
    <div class="form-group">
      <label for="ticketEmailInput">Email address</label>
      <input type="email" id="ticketEmailInput" class="form-control" placeholder="you@example.com" autocomplete="email" maxlength="254" required>
    </div>
    <button type="submit" id="trackBtn" class="btn btn-primary btn-block">Track ticket</button>
  </form>

  <div id="result" class="top-gap" aria-live="polite" hidden></div>
  <p class="center top-gap"><a href="/">← Back to chat support</a></p>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/track.js"></script>
</body>
</html>
