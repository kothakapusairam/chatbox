{% set title = "Customer Support" %}
{% include "_head.html" %}
<body>

<div class="app-container">
  <header class="chat-header">
    <div class="brand-wrapper">
      <div class="brand-logo-icon" aria-hidden="true">🤖</div>
      <div class="brand-details">
        <h1>AI Customer Support</h1>
        <div class="brand-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Online assistance • Ready to help</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <button id="trackTicketModalBtn" class="btn btn-outline btn-sm" type="button" title="Check an existing support ticket">
        🎫 Track ticket
      </button>
      <button id="escalateHeaderBtn" class="btn btn-accent btn-sm" type="button" title="Connect with a human support agent">
        👤 Human support
      </button>
      <button id="newChatBtn" class="btn btn-secondary btn-sm" type="button" title="Start a fresh conversation">
        🔄 New chat
      </button>
      <a href="/agent/login" class="btn btn-secondary btn-sm" title="Support agent portal">🔐 Agent portal</a>
    </div>
  </header>

  <main id="chatHistory" class="chat-history" role="log" aria-live="polite" aria-label="Conversation"></main>

  <nav class="quick-actions-bar" aria-label="Suggested questions">
    <span class="quick-actions-label">Quick actions:</span>
    <button class="quick-chip" type="button" data-query="Where is my order?">📦 Track order</button>
    <button class="quick-chip" type="button" data-query="I want to request a refund">💳 Request a refund</button>
    <button class="quick-chip" type="button" data-query="I would like to pay for my order">🧾 Pay for an order</button>
    <button class="quick-chip" type="button" data-query="How do I return a product?">🔄 Return a product</button>
    <button class="quick-chip" type="button" data-query="How do I reset my password?">🔑 Reset password</button>
    <button class="quick-chip" type="button" data-query="My payment failed during checkout">⚠️ Payment issues</button>
    <button class="quick-chip" type="button" data-query="I would like to speak to a human support agent">👤 Human support</button>
  </nav>

  <footer class="chat-input-container">
    <form id="chatForm" class="chat-input-wrapper">
      <label class="sr-only" for="userInput">Your message</label>
      <textarea id="userInput" class="chat-textarea" rows="1" maxlength="500"
        placeholder="Type your question (e.g. 'Track order ORD1025 john@example.com')…"></textarea>
      <div class="input-actions">
        <span id="charCount" class="char-counter">0 / 500</span>
        <button type="submit" id="sendBtn" class="send-button" title="Send (Enter)" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </form>
  </footer>
</div>

<!-- Modal: track an existing ticket -->
<div id="trackTicketModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-labelledby="trackTitle">
    <div class="modal-header">
      <h3 id="trackTitle">Track support ticket</h3>
      <button class="modal-close" id="closeTrackModal" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="ticketLookupInput">Ticket ID</label>
        <input type="text" id="ticketLookupInput" class="form-control" placeholder="TKT-XXXXXX" maxlength="20" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="ticketLookupEmail">Email used on the ticket</label>
        <input type="email" id="ticketLookupEmail" class="form-control" placeholder="you@example.com" maxlength="254" autocomplete="email">
      </div>
      <div id="ticketLookupResult" class="top-gap" hidden></div>
    </div>
    <div class="modal-footer">
      <button id="searchTicketBtn" class="btn btn-primary btn-sm" type="button">Look up status</button>
    </div>
  </div>
</div>

<!-- Modal: request human support -->
<div id="escalationModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-labelledby="escalationTitle">
    <div class="modal-header">
      <h3 id="escalationTitle">Request human support</h3>
      <button class="modal-close" id="closeEscalationModal" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <p class="muted small">Our team will follow up. Add your email so we can send updates.</p>
      <div class="form-group">
        <label for="escalateName">Full name</label>
        <input type="text" id="escalateName" class="form-control" placeholder="John Doe" maxlength="100">
      </div>
      <div class="form-group">
        <label for="escalateEmail">Email address</label>
        <input type="email" id="escalateEmail" class="form-control" placeholder="john@example.com" maxlength="254">
      </div>
      <div class="form-group">
        <label for="escalateIssue">Issue summary</label>
        <textarea id="escalateIssue" class="form-control" rows="3" maxlength="2000"
          placeholder="Briefly describe what you need help with…"></textarea>
      </div>
      <div id="escalateError" class="alert alert-error" role="alert" hidden></div>
    </div>
    <div class="modal-footer">
      <button id="submitEscalationBtn" class="btn btn-primary btn-sm" type="button">Submit ticket</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container" aria-live="assertive"></div>

<script src="/static/js/common.js"></script>
<script src="/static/js/chat.js"></script>
</body>
</html>
